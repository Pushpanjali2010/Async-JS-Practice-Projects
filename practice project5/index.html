<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 min-h-screen text-white">

    <!-- Container -->
    <div class="max-w-5xl mx-auto px-6 py-12">

        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold tracking-tight">
                GitHub User Finder
            </h1>
            <p class="text-slate-400 mt-3">
                Search any GitHub developer and explore their profile.
            </p>
        </div>

        <!-- Search Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl mb-8">
            <div class="flex flex-col md:flex-row gap-3">

                <input
                    type="text"
                    placeholder="Search GitHub username..."
                    class="userinp flex-1 bg-slate-950 border border-slate-800 rounded-xl px-5 py-4 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <button
                    class="search bg-blue-600 hover:bg-blue-700 transition-all px-8 py-4 rounded-xl font-semibold"
                >
                    Search
                </button>

            </div>
        </div>

        <!-- Profile Card -->
        <div class="card bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">

            

        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
